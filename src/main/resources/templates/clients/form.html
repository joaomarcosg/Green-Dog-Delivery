<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout" lang="pt-br">
<head>
    <title>Cliente</title>
</head>
<body>
<h1 layout:fragment="header">Cadastro de cliente</h1>
<div layout:fragment="content" class="input-form">

    <div class="well">
        <form id="clienteForm" th:action="@{/clients/(form)}" th:object="${client}" action="#" method="post"  class="form-horizontal">
            <div th:if="${#fields.hasErrors('*')}" class="alert alert-error">
                <p th:each="error : ${#fields.errors('*')}" th:text="${error}">Erro de validação</p>
            </div>

            <input type="hidden" th:field="*{id}" th:class="${#fields.hasErrors('id')} ? 'field-error'" />

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="control-label col-sm-2" for="name" style="margin-bottom: 0.5rem;">Nome</label>
                <input class="col-sm-10" type="text" th:field="*{name}" th:class="${#fields.hasErrors('name')} ? 'field-error'" />
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="control-label col-sm-2" for="address" style="margin-bottom: 0.5rem;">Endereço</label>
                <textarea class="col-sm-10" th:field="*{address}" th:class="${#fields.hasErrors('address')} ? 'field-error'"></textarea>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <input type="submit" value="Gravar" style="background-color: #0d6efd; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; min-width: 90px; text-align: center;" />
                <a th:href="@{/clients/}" href="clients.html" style="background-color: #6c757d; color: #fff; padding: 8px 16px; border-radius: 4px; text-decoration: none; display: inline-block; min-width: 90px; text-align: center;"> voltar </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
